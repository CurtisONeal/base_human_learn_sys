[project]
name = "video2mdnotes"
version = "0.1.0"
description = "Video to Markdown Notes Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.0.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
# macOS-only: the Vision-framework OCR backend and perceptual-hash
# de-duplication used by visual content extraction (EXTRACT_FRAMES=true).
# Kept out of the base deps because these will not install cleanly on
# Linux/Windows — see "Visual content" in README.md.
ocr = ["ocrmac>=1.0", "imagehash>=4.3"]

# EPUB needs nothing (stdlib zipfile + html.parser). PDF does: there is no
# stdlib text-layer extractor. Kept optional so the EPUB path stays installable
# anywhere, and declared as an extra rather than a bare dep because a plain
# `uv sync` silently strips anything not listed here — see FIXED_BUGS.
documents = ["pymupdf>=1.24"]

# Local semantic search: embeddings + cross-encoder rerank, both ONNX. No
# torch, and no embeddings API — book text never leaves the machine, which is
# the point (see core/corpus/embed.py). onnxruntime and numpy are already
# present, so this is three small packages.
semantic = ["fastembed>=0.8"]

dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video2mdnotes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as slow integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
